<style>
/* ---------------------------------------------------------------
   Tokens. Every value is named after a material of the subject:
   a knotted-cord ledger (quipu) dyed with walnut and cochineal,
   hung on a limestone wall. Source: direction.md (this folder).
---------------------------------------------------------------- */
:root{
  --quarry:#D5D8CE;      /* ground: limestone dust, tinted grey-green */
  --lint:#E4E6DC;        /* surface: loom lint, one step up */
  --walnut:#231F1B;      /* ink: walnut dye */
  --umber:#54504A;       /* muted ink: llama hair, 5.6:1 on quarry */
  --cotton:#F3EFE2;      /* undyed cotton: the cord itself */
  --cochineal:#8C1D38;   /* the only accent: held and free to spend */
  --rule:rgba(35,31,27,.26);
  --rule-soft:rgba(35,31,27,.12);

  --font-ui:"Familjen Grotesk","Segoe UI",ui-sans-serif,system-ui,sans-serif;
  --font-data:"Spline Sans Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;

  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:72px;--s9:112px;
  --gutter:clamp(16px,4vw,56px);

  --dur-press:120ms;--dur-hover:150ms;--dur-popover:180ms;--dur-moment:420ms;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
  --press-scale:.97;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--umber) var(--quarry);scrollbar-width:thin}
body{
  margin:0;background:var(--quarry);color:var(--walnut);
  font:400 17px/1.5 var(--font-ui);
  caret-color:var(--cochineal);
  min-height:100vh;
  /* limestone grain, real noise, not a gradient */
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .14  0 0 0 0 .12  0 0 0 0 .10  0 0 0 .5 0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='.28'/></svg>");
}
::selection{background:var(--cochineal);color:var(--cotton)}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.04;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
a{color:inherit;text-underline-offset:.2em;text-decoration-thickness:1px}
.num,.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--cochineal);outline-offset:2px}
main:focus{outline:none}
.why :focus-visible,.why a:focus-visible{outline-color:var(--cotton)}

/* ---------- chrome ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s5);
  padding-block:var(--s5) var(--s3);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:var(--s4);text-decoration:none;color:var(--walnut)}
.brand .mark{width:46px;height:46px;flex:none;overflow:visible}
.brand .word{font-weight:700;font-size:1.3125rem;line-height:1;letter-spacing:.2em;text-transform:uppercase;display:inline-flex;align-items:center;white-space:nowrap}
.brand .hh{display:inline-block;position:relative;width:.72em;height:.76em;margin:0 .2em 0 .04em;font-style:normal}
.brand .hh::before,.brand .hh::after{content:"";position:absolute;top:0;bottom:0;width:.15em;background:currentColor}
.brand .hh::before{left:0}.brand .hh::after{right:0}
.brand .hh b{position:absolute;left:.1em;right:.1em;top:50%;height:.27em;margin-top:-.135em;background-color:var(--cotton);box-shadow:0 0 0 .035em var(--walnut);background-image:repeating-linear-gradient(35deg,rgba(35,31,27,.35) 0 1px,transparent 1px 3.5px)}
.brand .hh.a b{background-color:#4a423a}
.brand .hh.b b{background-color:var(--cochineal)}
.brand small{display:block;font:400 .875rem/1.25 var(--font-ui);color:var(--umber);letter-spacing:0;text-transform:none;margin-top:var(--s2)}
.brand .stack{display:block}
nav ul{display:flex;gap:var(--s1);list-style:none;margin:0;padding:0;flex-wrap:wrap}
nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 var(--s4);text-decoration:none;
  border-radius:3px;font-weight:600;font-size:.875rem;letter-spacing:.12em;text-transform:uppercase;transition:background-color var(--dur-hover) ease}
nav a[aria-current="page"]{background:var(--lint);font-weight:700}
@media (hover:hover) and (pointer:fine){nav a:hover{background:rgba(228,230,220,.6)}}
.wrap{padding-inline:var(--gutter);max-width:1360px;margin-inline:auto}
main{padding-block:var(--s6) 0}
.stage>.cordwrap+*{}

/* ---------- controls ---------- */
.btn{font:600 1rem/1 var(--font-ui);min-height:48px;padding:0 var(--s5);border-radius:3px;cursor:pointer;
  border:1.5px solid var(--walnut);background:transparent;color:var(--walnut);
  transition:background-color var(--dur-hover) ease,color var(--dur-hover) ease,transform var(--dur-press) var(--ease-out);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);text-decoration:none}
.btn:active:not([aria-disabled="true"]){transform:scale(var(--press-scale))}
@media (hover:hover) and (pointer:fine){.btn:hover:not([aria-disabled="true"]){background:var(--lint)}}
.btn.fill{background:var(--walnut);color:var(--cotton)}
@media (hover:hover) and (pointer:fine){.btn.fill:hover:not([aria-disabled="true"]){background:#3a342e}}
.btn.accent{background:var(--cochineal);border-color:var(--cochineal);color:var(--cotton)}
@media (hover:hover) and (pointer:fine){.btn.accent:hover:not([aria-disabled="true"]){background:#74172e}}
.btn[aria-disabled="true"]{cursor:not-allowed;background:transparent;color:var(--umber);border-style:dashed;border-color:var(--umber)}
.btn.fill[aria-disabled="true"],.btn.accent[aria-disabled="true"]{background:var(--lint)}
.btn[aria-busy="true"]{cursor:progress}
.link-btn{font:inherit;background:none;border:0;padding:0;min-height:44px;text-decoration:underline;text-underline-offset:.2em;cursor:pointer;color:inherit}
.help{color:var(--umber);font-size:.9375rem}
.field{display:grid;gap:var(--s2);margin-top:var(--s4)}
.field label{font-weight:600}
.field input[type=text]{font:500 1.125rem var(--font-data);min-height:48px;padding:0 var(--s3);background:var(--cotton);
  border:1.5px solid var(--walnut);border-radius:3px;color:var(--walnut);width:100%;max-width:14rem}
.err{color:var(--cochineal);font-weight:600}

/* provenance words: text carries it, never color alone */
.tag{font:500 .875rem/1 var(--font-data);white-space:nowrap;color:var(--umber)}
.tag.measured{color:var(--walnut);font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.3em}
.tag.computed{text-decoration:underline dashed;text-underline-offset:.3em}
.tag.fixture{font-style:italic}
.tag.documented{text-decoration:underline dotted;text-underline-offset:.3em}

/* ---------- lease ---------- */
.stage{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--s5)}
.lead{grid-column:1 / span 8;padding-bottom:var(--s5)}
.lead h1{font-size:clamp(2.6rem,6.4vw,5.9rem);max-width:12ch}
h1 .num,.big .num,.payout.num{font-family:var(--font-ui);font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.lead .sub{font-size:1.25rem;max-width:34rem;margin-top:var(--s5)}
.honor{grid-column:9 / span 4;align-self:end;padding-bottom:var(--s5)}
.honor h2{font-size:1rem;letter-spacing:0;line-height:1.3;margin-bottom:var(--s2)}
.rulebar{position:relative;height:30px;margin:var(--s3) 0 var(--s2)}
.rulebar i{position:absolute;top:13px;height:3px;background:var(--walnut)}
.rulebar b{position:absolute;top:6px;width:2px;height:17px;background:var(--walnut)}
.rulebar em{position:absolute;top:13px;height:3px;border-top:3px dotted var(--umber)}
.cordwrap{grid-column:1 / -1;position:relative;margin-block:var(--s2) 0}
.cordwrap svg{display:block;width:100%;height:auto;overflow:visible}
.readout{min-height:3.2rem;padding-top:var(--s4);margin-top:var(--s2);display:flex;gap:var(--s4);flex-wrap:wrap;align-items:baseline}
.readout strong{font-weight:700}
.band{background:var(--lint);margin-top:var(--s8);padding-block:var(--s7) var(--s8)}
.band .ledger{grid-column:1 / span 8}
.band .controls{grid-column:9 / span 4}
.band .confirm{background:var(--quarry)}
.band tbody tr:nth-child(odd) td{background:rgba(35,31,27,.045)}
.controls>*+*{margin-top:var(--s5)}
.btnrow{display:flex;gap:var(--s3);flex-wrap:wrap}
h2.sec{font-size:1.5rem;margin-bottom:var(--s4)}
table{border-collapse:collapse;width:100%}
caption{text-align:left}
th,td{padding:var(--s3) var(--s5) var(--s3) var(--s3);text-align:left;vertical-align:baseline}
th{font-weight:600;font-size:.9375rem;color:var(--umber);padding-bottom:var(--s2)}
tbody tr:nth-child(odd) td{background:rgba(35,31,27,.04)}
td.r,th.r{text-align:right}
td.r:last-child,th.r:last-child{padding-right:0}
tfoot tr:first-child td{padding-top:var(--s5)}
tfoot td{font-weight:600}
.rowbtn{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-height:44px;width:100%;
  display:flex;align-items:center;gap:var(--s3)}
tr.sel td{background:var(--lint)}
@media (hover:hover) and (pointer:fine){tbody tr:hover td{background:var(--lint)}}
.wide{overflow-x:auto}
.log{list-style:none;margin:var(--s4) 0 0;padding:0;display:grid;gap:var(--s2);font-size:.9375rem}
.log li{display:flex;gap:var(--s3)}
.log time{font-family:var(--font-data);color:var(--umber)}
.confirm{background:var(--lint);padding:var(--s4)}
.empty{padding:var(--s5) 0;max-width:34rem}

/* cord svg parts */
.pen{transition:opacity var(--dur-hover) ease}
.dim .pen:not(.sel){opacity:.42}
.pen.sel .body{stroke-width:2;stroke:var(--walnut)}
.pen .hit{fill:transparent;cursor:pointer}
@keyframes drop{from{transform:translateY(-26px);opacity:0}to{transform:translateY(0);opacity:1}}
.pen.drop,.pen.settle{transform-box:fill-box;animation:drop var(--dur-moment) var(--ease-out) both}
@keyframes cut{to{transform:translate(0,30px) rotate(2deg);opacity:.45}}
.tail{transform-box:fill-box;transform-origin:left center;animation:cut 520ms var(--ease-in-out) forwards}

/* ---------- escrow ---------- */
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--s7) var(--s6);align-items:start}
.title-block h1{font-size:clamp(2.3rem,5vw,4.4rem);max-width:15ch}
.title-block .sub{margin-top:var(--s5);font-size:1.1875rem;max-width:32rem}
.judge{margin-top:var(--s6)}
.judge h3{font-size:1.125rem;letter-spacing:0;line-height:1.3}
.seg{display:flex;border:1.5px solid var(--walnut);border-radius:3px;overflow:hidden;margin-top:var(--s3);max-width:32rem}
.seg button{flex:1;font:600 1rem var(--font-ui);min-height:48px;background:transparent;border:0;cursor:pointer;color:var(--walnut);
  border-right:1.5px solid var(--walnut);transition:background-color var(--dur-hover) ease}
.seg button:last-child{border-right:0}
.seg button[aria-checked="true"]{background:var(--walnut);color:var(--cotton)}
@media (hover:hover) and (pointer:fine){.seg button[aria-checked="false"]:hover{background:var(--lint)}}
.seg button:focus-visible{outline-offset:-4px}
.scorerow{display:flex;align-items:center;gap:var(--s4);margin-top:var(--s3);max-width:32rem}
.scorerow label{font-weight:600;min-width:4.4rem}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;flex:1;height:44px;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:var(--walnut);border-radius:3px}
input[type=range]::-moz-range-track{height:5px;background:var(--walnut);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:30px;margin-top:-12.5px;background:var(--cotton);border:2px solid var(--walnut);border-radius:2px}
input[type=range]::-moz-range-thumb{width:8px;height:26px;background:var(--cotton);border:2px solid var(--walnut);border-radius:2px}
.ply-out{margin-top:var(--s5)}
.ply-out svg{width:100%;height:auto;display:block;overflow:visible}
.kernel{background:var(--lint);margin-top:var(--s6);padding:var(--s5)}
.kernel dl{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s5);margin:var(--s3) 0 0}
.kernel dt{color:var(--umber)}
.kernel dd{margin:0;font-weight:600}
.payout{font-size:clamp(2.2rem,4.4vw,3.6rem);font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-top:var(--s4)}
pre.rule{font:400 .9375rem/1.6 var(--font-data);background:rgba(35,31,27,.06);padding:var(--s4);margin:var(--s4) 0 0;overflow-x:auto}

/* ---------- settle ---------- */
.bundle{display:flex;gap:0;margin-top:var(--s6);align-items:flex-start}
.grp{min-width:0;flex:var(--w) 1 0;padding-inline:0}
.cordseg{height:20px;background-color:var(--cotton);border:1px solid var(--walnut);
  background-image:repeating-linear-gradient(35deg,rgba(35,31,27,.28) 0 1.5px,transparent 1.5px 7px);margin-top:var(--s3)}
.whip{flex:0 0 12px;height:34px;margin-top:var(--s2);background:var(--walnut);
  background-image:repeating-linear-gradient(60deg,rgba(243,239,226,.55) 0 1px,transparent 1px 4px)}
.grp .cap{padding:var(--s3) var(--s2) 0 0;font-size:.9375rem}
.grp .cap b{display:block;font-weight:700;font-size:1rem}
.range-block{margin-top:var(--s6);max-width:40rem}
.compare{margin-top:var(--s6);max-width:44rem}
.big{font-size:clamp(2.2rem,5.4vw,4.8rem);font-weight:600;letter-spacing:-.025em;line-height:1.02;max-width:17ch}

/* ---------- proof ---------- */
.proofhead{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s6);align-items:end}
.proofhead h1{font-size:clamp(2.3rem,5vw,4.4rem);max-width:16ch}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s6);margin-top:var(--s8)}
.three h2{font-size:1.25rem;letter-spacing:-.01em;line-height:1.2;margin:var(--s3) 0 var(--s3)}
.three ul{margin:0;padding-left:1.1rem}
.three li+li{margin-top:var(--s2)}
.col{background:var(--lint);padding:var(--s5)}
.awaiting{font:600 .9375rem var(--font-data);border:1.5px dashed var(--walnut);padding:var(--s1) var(--s2);display:inline-block}

body.lease .sp{display:none}
.sp{height:var(--s8)}
footer{background:#C9CCC1;padding:var(--s6) var(--gutter) calc(var(--s6) + env(safe-area-inset-bottom,0px));color:var(--umber);font-size:.9375rem}
footer .wrap{padding:0;display:flex;gap:var(--s3) var(--s6);flex-wrap:wrap;align-items:baseline}
footer p{max-width:44rem}

/* ---------- approve ---------- */
.approve{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:var(--s8);align-items:start}
.approve h1{font-size:clamp(2.6rem,6vw,5.4rem);max-width:11ch}
.terms{list-style:none;padding:0;margin:var(--s5) 0 var(--s5);display:grid;gap:var(--s5)}
.terms li{display:grid;grid-template-columns:auto 1fr;gap:var(--s4);padding-top:var(--s2)}
.terms li span:first-child{font:500 .9375rem var(--font-data);color:var(--umber);padding-top:.25em;min-width:8.5ch}
.slimcord{margin-bottom:var(--s6)}
.slimcord svg{display:block;width:100%;height:auto}

@media (max-width:900px){
  .lead,.honor,.band .ledger,.band .controls{grid-column:1 / -1}
  .band .controls{margin-top:var(--s6)}
  .two,.proofhead,.approve{grid-template-columns:minmax(0,1fr)}
  .three{grid-template-columns:minmax(0,1fr);gap:var(--s6)}
  .approve{gap:var(--s6)}
  .band{margin-top:var(--s7);padding-block:var(--s6) var(--s7)}
}
@media (max-width:720px){
  .cordwrap{max-width:420px}
  .bundle{flex-direction:column}
  .whip{flex:0 0 10px;width:34px;height:10px;margin-top:0;margin-left:0}
  .grp{flex:none;width:100%}
  .cordseg{margin-top:var(--s2)}
}
@media (prefers-reduced-motion:reduce){
  .pen.drop,.pen.settle{animation:none}
  .tail{animation:none;opacity:.45;transform:translate(0,30px)}
  .btn,.seg button,.pen{transition:none}
}

/* =================== site: landing, sign up, log in =================== */
.acts{display:flex;align-items:center;gap:var(--s3)}
.acts .nav-login,.acts .who,.acts .link-btn.so{display:inline-flex;align-items:center;min-height:44px;padding:0 var(--s3);font-weight:600;font-size:.875rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.acts .who{color:var(--umber);font-weight:500;letter-spacing:.04em;text-transform:none}
.acts .link-btn.so{background:none;border:0;cursor:pointer;color:inherit;font-family:inherit;text-decoration:none;border-radius:3px}
@media (hover:hover) and (pointer:fine){.acts .nav-login:hover,.acts .link-btn.so:hover{background:rgba(228,230,220,.6)}}
.btn.sm{min-height:44px;padding:0 var(--s4);font-size:.9375rem}
body[data-mode="site"] main,body[data-mode="flow"] main{padding-block:0}
body[data-mode="site"] .sp,body[data-mode="flow"] .sp{display:none}
body[data-mode="site"] .bar{position:relative;z-index:3}
.sect{padding-block:var(--s9)}
.sect h2.big2{font-size:clamp(2rem,4.6vw,4rem);max-width:19ch;letter-spacing:-.025em;line-height:1.04}
.lede{font-size:clamp(1.0625rem,1.5vw,1.3125rem);max-width:36rem;margin-top:var(--s5)}

/* hero */
.hero{padding-top:var(--s7)}
.hero h1{font-size:clamp(2.8rem,7.2vw,6.6rem);max-width:13ch;letter-spacing:-.03em}
.hero .lede{max-width:34rem}
.hero .ctas{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s6);align-items:center}
.hero .ctas .btn{min-height:52px;padding-inline:var(--s6);font-size:1.0625rem}
.herocord{margin-top:var(--s7)}
.herocord svg{display:block;width:100%;height:auto;overflow:visible}
.herolog{display:flex;gap:var(--s4);align-items:baseline;flex-wrap:wrap;min-height:3.4rem;padding-top:var(--s4);color:var(--umber);font-size:.9375rem}
.herolog strong{color:var(--walnut)}

/* why: one dark band, read by evening light */
.why{background:var(--walnut);color:var(--cotton);padding-block:var(--s9)}
.why h2{max-width:20ch}
.why .muted{color:#BDB8AB}
.why a{color:var(--cotton)}
.gap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s7);margin-top:var(--s7);align-items:end}
.gapn{font-size:clamp(3.4rem,9vw,8rem);font-weight:600;letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums}
.gapi p{margin-top:var(--s3);max-width:24rem;color:#DAD5C7}
.tcs{margin-top:var(--s6)}
.tcs .tcord{margin-top:var(--s3)}
.tcord{height:20px;margin-top:var(--s4);width:calc(var(--p)*1%);background-color:var(--cotton);border-radius:2px;
  background-image:repeating-linear-gradient(35deg,rgba(35,31,27,.34) 0 1.5px,transparent 1.5px 7px)}
.tcord.hot{background-color:#C2445F}
.asks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s6);margin-top:var(--s8)}
.asks .n{font-size:clamp(2.4rem,4.4vw,3.8rem);font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.asks p{margin-top:var(--s2);color:#DAD5C7}
.src{margin-top:var(--s6);font-size:.9375rem;color:#BDB8AB;max-width:44rem}
.pivot{margin-top:var(--s8);font-size:clamp(1.4rem,2.6vw,2.2rem);max-width:30ch;font-weight:500;letter-spacing:-.01em;line-height:1.2}

/* measured, our own */
.own{background:var(--lint)}
.own .pair{display:flex;gap:var(--s8);flex-wrap:wrap;margin-top:var(--s6);align-items:baseline}
.own .pair .n{font-size:clamp(2.6rem,6vw,5rem);font-weight:600;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.own .pair p{margin-top:var(--s2);max-width:20rem;color:var(--umber)}

/* how */
.how{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--s7);margin-top:var(--s7);align-items:start}
.tabs{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s6)}
.tabs button{font:600 .9375rem var(--font-ui);min-height:44px;padding:0 var(--s4);border-radius:3px;border:0;background:var(--lint);color:var(--walnut);cursor:pointer;
  transition:background-color var(--dur-hover) ease,color var(--dur-hover) ease}
.tabs button[aria-selected="true"]{background:var(--walnut);color:var(--cotton)}
@media (hover:hover) and (pointer:fine){.tabs button[aria-selected="false"]:hover{background:#d4d7cb}}
.how h3{font-size:clamp(1.6rem,2.6vw,2.3rem);letter-spacing:-.02em;line-height:1.1}
.how .body p{margin-top:var(--s4);font-size:1.125rem;max-width:30rem}
.stage-v{background:var(--lint);padding:var(--s5)}
.stage-v svg{display:block;width:100%;height:auto;overflow:visible}
.stage-v .cap{margin-top:var(--s3);color:var(--umber);font-size:.9375rem}

/* honest limits, two plain columns on a tonal ground */
.limits{background:var(--lint)}
.limits .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s8);margin-top:var(--s7)}
.limits h3{font-size:1.375rem;letter-spacing:-.01em;line-height:1.2}
.limits ul{margin:var(--s4) 0 0;padding:0;list-style:none;display:grid;gap:var(--s4)}
.limits li{max-width:28rem}

/* built for: uneven bento by tone and span */
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s4);margin-top:var(--s7)}
.bento>div{padding:var(--s6);min-height:15rem;display:flex;flex-direction:column;justify-content:flex-end}
.bento h3{font-size:1.5rem;letter-spacing:-.015em;line-height:1.15;max-width:16ch}
.bento p{margin-top:var(--s3);max-width:26rem}
.bento .b1{grid-column:span 4;background:var(--lint)}
.bento .b2{grid-column:span 2;background:#c9ccc1}
.bento .b3{grid-column:span 2;background:#c9ccc1}
.bento .b4{grid-column:span 4;background:var(--lint)}

/* faq */
.faq{max-width:46rem;margin-top:var(--s7);display:grid;gap:var(--s2)}
.faq details{background:var(--lint);padding:0}
.faq summary{list-style:none;cursor:pointer;min-height:56px;padding:var(--s4) var(--s5);font-weight:600;font-size:1.0625rem;display:flex;justify-content:space-between;gap:var(--s4);align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"Open";font:500 .875rem var(--font-data);color:var(--umber)}
.faq details[open] summary::after{content:"Close"}
.faq details p{padding:0 var(--s5) var(--s5);max-width:38rem}
.faq details[open]{background:#dcded3}

/* closing band */
.close{padding-block:var(--s9)}
.close h2{font-size:clamp(2.6rem,7vw,6rem);max-width:12ch;letter-spacing:-.03em;line-height:1}
.close .ctas{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s6)}
.close .btn{min-height:52px;padding-inline:var(--s6);font-size:1.0625rem}

body[data-mode="site"] footer{padding-block:var(--s7)}
footer .cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr) minmax(0,3fr);gap:var(--s6);width:100%}
footer h4{margin:0 0 var(--s3);font-size:.875rem;letter-spacing:.12em;text-transform:uppercase;color:var(--walnut)}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2)}
footer li a{display:inline-flex;align-items:center;min-height:32px}

/* flow: sign up and log in */
.flow{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:calc(100vh - 110px)}
.flow-side{background:var(--lint);padding:var(--s8) var(--s6) var(--s8) max(var(--gutter),calc((100vw - 1360px)/2 + var(--gutter)));display:flex;flex-direction:column;justify-content:space-between;gap:var(--s7)}
.flow-side h2{font-size:clamp(2rem,3.6vw,3.2rem);letter-spacing:-.025em;line-height:1.05;max-width:15ch}
.flow-side p{margin-top:var(--s4);max-width:26rem;color:var(--umber)}
.flow-main{padding:var(--s8) var(--gutter) var(--s8);max-width:44rem}
.flow-main h1{font-size:clamp(2rem,4vw,3.2rem);letter-spacing:-.025em;line-height:1.05;max-width:16ch}
.flow-main .sub{margin-top:var(--s4);max-width:30rem;color:var(--umber)}
.flow-main form,.flow-main .fm-body{margin-top:var(--s6)}
.fgrid{display:grid;gap:var(--s5)}
.f label,.f .lab{display:block;font-weight:600;margin-bottom:var(--s2)}
.f input[type=text],.f input[type=email]{font:500 1.0625rem var(--font-ui);min-height:52px;padding:0 var(--s4);background:var(--cotton);border:0;border-radius:3px;color:var(--walnut);width:100%;box-shadow:inset 0 0 0 1.5px rgba(35,31,27,.55)}
.f input:focus-visible{outline:2px solid var(--cochineal);outline-offset:2px}
.f input[aria-invalid="true"]{box-shadow:inset 0 0 0 2px var(--cochineal)}
.f .hint{margin-top:var(--s2);color:var(--umber);font-size:.9375rem}
.f .errtxt{margin-top:var(--s2);color:var(--cochineal);font-weight:600;font-size:.9375rem}
.actions{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center;margin-top:var(--s6)}
.actions .btn{min-height:52px;padding-inline:var(--s6)}
.swap{margin-top:var(--s5);color:var(--umber)}
.cboxes{display:flex;gap:var(--s2)}
.cboxes input{width:3.4rem;height:4rem;text-align:center;font:600 1.75rem var(--font-data);background:var(--cotton);border:0;border-radius:3px;color:var(--walnut);box-shadow:inset 0 0 0 1.5px rgba(35,31,27,.55);padding:0}
.cboxes input:focus-visible{outline:2px solid var(--cochineal);outline-offset:2px}
.cboxes.bad input{box-shadow:inset 0 0 0 2px var(--cochineal)}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap}
.chips button{font:600 1rem var(--font-ui);min-height:48px;padding:0 var(--s5);border:0;border-radius:3px;background:var(--lint);color:var(--walnut);cursor:pointer;transition:background-color var(--dur-hover) ease,color var(--dur-hover) ease}
.chips button[aria-pressed="true"]{background:var(--walnut);color:var(--cotton)}
@media (hover:hover) and (pointer:fine){.chips button[aria-pressed="false"]:hover{background:#d4d7cb}}
.mandate{margin-top:var(--s6);padding:var(--s5);background:var(--lint)}
.mandate p{font-size:1.125rem;max-width:30rem}
.summ{display:grid;grid-template-columns:auto 1fr;gap:var(--s3) var(--s6);margin:var(--s6) 0 0}
.summ dt{color:var(--umber)}
.summ dd{margin:0;font-weight:600}
.linked{margin-top:var(--s5);padding:var(--s4) var(--s5);background:var(--lint);display:inline-block}
pre.snip{font:400 .9375rem/1.6 var(--font-data);background:var(--walnut);color:var(--cotton);padding:var(--s5);overflow-x:auto;margin:var(--s4) 0 0;border-radius:3px}
.testres{margin-top:var(--s4);padding:var(--s4) var(--s5);background:var(--lint)}
.flow-side .vc{max-height:62vh;display:flex;justify-content:flex-start}
.flow-side .vc svg{height:min(62vh,640px);width:auto;max-width:100%;overflow:visible}
.pcord{display:flex;align-items:center;gap:var(--s4);color:var(--umber);font-size:.9375rem}
.pcord svg{display:block;width:150px;height:28px;flex:none}
.bar.flowbar{align-items:center}

@media (max-width:900px){
  .gap,.how,.limits .cols,footer .cols{grid-template-columns:minmax(0,1fr)}
  .asks{grid-template-columns:minmax(0,1fr);gap:var(--s5)}
  .bento{grid-template-columns:minmax(0,1fr)}
  .bento>div{grid-column:auto!important;min-height:11rem}
  .flow{grid-template-columns:minmax(0,1fr)}
  .flow-side .vc{display:none}
  .flow-side{padding-block:var(--s6);gap:var(--s5)}
  .flow-main{padding-block:var(--s6)}
  .sect,.why,.close{padding-block:var(--s8)}

}

  body[data-mode="site"] .bar nav{display:none}
  .herocord{max-width:340px}
  .stage-v{padding:var(--s4)}
  .cboxes input{width:2.8rem;height:3.6rem}

@media (prefers-reduced-motion:reduce){.tabs button,.chips button{transition:none}}
/* Spending instrument, ported to apps/web/app/pd.css. */
.instrument{--face:#152421;--face-ink:#f4f0df;--face-muted:#bac9be;--accent:#e9c38a;--face-rule:#60736a;background:var(--face);color:var(--face-ink);padding:clamp(17px,3vw,36px);display:grid;gap:16px;min-width:0}
.instrument .caption{color:var(--face-muted);font:500 .75rem/1.4 var(--data,monospace);letter-spacing:.065em;text-transform:uppercase}
.instrument .reading{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:end}
.instrument .digits{display:block;font:500 clamp(2.75rem,6vw,5.5rem)/1 var(--data,monospace);letter-spacing:-.08em;font-variant-numeric:tabular-nums}
.instrument .minor{font:500 1.1rem var(--data,monospace);font-variant-numeric:tabular-nums}
.instrument .rail{height:25px;position:relative;margin:0 2.25rem 0 0;border-bottom:1px solid var(--face-rule)}
.instrument .rail::before{content:"";position:absolute;left:0;right:0;bottom:0;border-bottom:3px solid var(--face-muted)}
.instrument .rail::after{content:"";position:absolute;right:0;bottom:-7px;width:2px;height:32px;background:var(--accent)}
.instrument .strike{position:absolute;right:-1px;bottom:7px;height:3px;width:52%;transform-origin:left;background:var(--accent);animation:arrive 260ms cubic-bezier(.2,.75,.35,1) both}
@keyframes arrive{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.instrument .strike{animation:none}}
.instrument .task{border-top:1px solid var(--face-rule);padding-top:12px;display:grid;gap:4px}
.instrument .actionline{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.instrument .instrument-action{background:var(--accent);color:#1d261f;border:1px solid var(--accent);border-radius:2px;min-height:44px;padding:0 16px;font:700 1rem var(--ui,system-ui);cursor:pointer}
.instrument .instrument-action:disabled{opacity:.65;cursor:wait}
.instrument .instrument-action:focus-visible,.instrument a:focus-visible{outline:2px solid white;outline-offset:3px}
.instrument a{color:var(--face-ink)}
.instrument .receipt{border-left:3px solid var(--accent);padding:4px 12px;display:grid;gap:4px}
.instrument .receipt strong{font-size:1.125rem}
.instrument .receipt p{font-size:.95rem}

<body>
<header id="hdr"></header>
<main id="main" tabindex="-1"></main>
<div class="sp" aria-hidden="true"></div>
<footer id="ftr"></footer>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="padding:24px">This prototype draws its cord with JavaScript. Please enable it.</p></noscript>

<script>
(()=>{
"use strict";
/* =============================================================
   Money is integer cents. Nothing here is a float.
============================================================= */
let CAP=2000;
const fmt=c=>"$"+(c/100).toFixed(2);
const feeC=c=>Math.round(49+0.0349*c);          // computed model, three measured points fit it
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const tagHtml=(k,t)=>`<span class="tag ${k}">${t||k}</span>`;

/* measured: raw rows from evidence/spike2-log.masked.jsonl, auth 3JR45593UX474005K */
const MEASURED=[["8KK17784DB464635E","16:17:20"],["3F738302AV910594B","16:17:23"],["11H34634K9873640M","16:17:26"],["7X372453FD414441H","16:17:29"],["9W4967933R4765939","16:17:31"],["1NL47230D4507635W","16:17:34"],["1EN26299VG4180452","16:17:36"],["2KU9406534856942A","16:17:39"],["5XD45021CD582593A","16:17:42"],["2WY25534LV958454K","16:17:45"],["19317627JP720332M","16:17:48"],["84F24590SX6367626","16:17:51"]];

const SAMPLE=()=>[
  {id:1,tool:"flights.search",c:120,st:"captured",t:"09:02"},
  {id:2,tool:"pdf.extract",c:75,st:"captured",t:"09:04"},
  {id:3,tool:"geocode.batch",c:250,st:"captured",t:"09:11"},
  {id:4,tool:"filings.fetch",c:300,st:"captured",t:"09:15"},
  {id:5,tool:"translate.es",c:40,st:"accrued",t:"09:38"},
  {id:6,tool:"pdf.extract",c:115,st:"accrued",t:"09:41"},
  {id:7,tool:"web.search",c:35,st:"accrued",t:"09:44"}
];
const QUEUE=[["maps.route",60],["filings.fetch",225],["summarize.long",475],["web.search",35],["pdf.extract",115],["translate.es",40],["summarize.long",475],["maps.route",60]];

const S={
  status:"active",       // active | voided | none
  calls:SAMPLE(),
  q:0, nextId:8, clock:9*60+46,
  running:false, timer:null,
  log:[{t:"09:44",m:"Spent $0.35 on web.search."}],
  refused:0, settles:[], voided:null,
  ui:{sel:null,voidOpen:false,approve:"idle",settleN:null,settleBusy:false,settleDone:null,firstPaint:true,
      esc:{a:{v:2,s:88},b:{v:1,s:64}}}
};
const sums=()=>{let C=0,A=0;for(const k of S.calls){if(k.st==="captured")C+=k.c;else if(k.st==="accrued")A+=k.c}
  return {C,A,F:S.status==="voided"?0:CAP-C-A,held:S.status==="voided"?0:CAP-C}};
const clockStr=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const say=m=>{$("#live").textContent=m};

/* =============================================================
   The cord. One drawing, used on Lease, Proof, and as a slim
   status strip. Quipu rules: pendants hang from one main cord,
   and the amount is tied as knots by decimal place.
============================================================= */
const LEVELS=[36,98,160,222];
const digits=c=>[Math.floor(c/1000)%10,Math.floor(c/100)%10,Math.floor(c/10)%10,c%10];
const NSLOT=16;

function cordSVG(o){
  const N=o.N||NSLOT, vertical=!!o.vertical, L=vertical?820:1072, x0=64, y0=62, cap=o.cap||CAP;
  const k=L/cap, z=o.ghost?0:1, wC=o.C*k*z, wA=o.A*k*z, wF=o.F*k*z;
  let defs=`<defs>
    <pattern id="ply" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="7" height="7" fill="none"/><line x1="0" y1="0" x2="0" y2="7" stroke="#231F1B" stroke-opacity=".3" stroke-width="1.6"/></pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#231F1B" stroke-opacity=".38" stroke-width="1.2"/></pattern>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2.5" stdDeviation="1.6" flood-color="#231F1B" flood-opacity=".32"/></filter>
  </defs>`;
  const seg=(x,w,fill,over,cls)=>w<=0?"":`<g class="${cls||""}"><rect x="${x}" y="${y0-9}" width="${w}" height="18" fill="${fill}" stroke="#231F1B" stroke-width=".8"/><rect x="${x}" y="${y0-9}" width="${w}" height="18" fill="${over}"/></g>`;
  const whip=x=>`<g><rect x="${x-4}" y="${y0-13}" width="8" height="26" fill="#231F1B"/><path d="M${x-4} ${y0-9}l8 4M${x-4} ${y0-3}l8 4M${x-4} ${y0+3}l8 4M${x-4} ${y0+9}l8 3" stroke="#F3EFE2" stroke-opacity=".6" stroke-width="1"/></g>`;
  let main="";
  let xc=x0;
  if(o.ghost){main=`<rect x="${x0}" y="${y0-9}" width="${L}" height="18" fill="none" stroke="#231F1B" stroke-width="1.4" stroke-dasharray="6 6"/>`}
  main+=seg(xc,wC,"#4a423a","url(#ply)");                 // captured: walnut dye
  if(wC>0){xc+=wC}
  main+=seg(xc,wA,"#F3EFE2","url(#hatch)");               // accrued: bare cotton, not yet settled
  if(wC>0&&wA>0)main+=whip(x0+wC);
  xc+=wA;
  if(o.voided){
    const wT=(o.relA+o.relF)*k;
    // the released length is cut away and left as a faded tail
    main+=`<g class="${o.animCut?"tail":""}" style="${o.animCut?"":"opacity:.45;transform:translate(0,30px)"}"><rect x="${xc}" y="${y0-9}" width="${Math.max(wT-wA,0)}" height="18" fill="none" stroke="#231F1B" stroke-width="1" stroke-dasharray="5 4"/></g>`;
    main+=`<path d="M${xc} ${y0-12}v24" stroke="#231F1B" stroke-width="2"/>`;
  }else{
    main+=seg(xc,wF,"#8C1D38","url(#ply)");               // free to spend: cochineal
    if(wA>0&&wF>0)main+=whip(xc);
  }
  const endx=x0+L;
  const frays=[-5,0,5].map(d=>`<path d="M${endx} ${y0+d} l12 ${d*1.6}" stroke="#231F1B" stroke-width="1.3" stroke-linecap="round"/>`).join("");
  const loop=`<line x1="22" y1="14" x2="22" y2="112" stroke="#54504A" stroke-width="6" stroke-linecap="round"/>
    <rect x="12" y="28" width="${x0-6}" height="68" rx="30" fill="none" stroke="#231F1B" stroke-width="9"/>
    <rect x="12" y="28" width="${x0-6}" height="68" rx="30" fill="none" stroke="#F3EFE2" stroke-width="5" stroke-dasharray="3 4"/>`;
  let pens="";
  const items=o.items.slice(0,N);
  // a pendant hangs where its call was paid on the cord, with a minimum gap so knots never touch
  const xs=[]; let cum=0, prev=-1e9; const gap=vertical?40:38;
  items.forEach(it=>{cum+=it.c; let x=x0+cum*k; if(x<prev+gap)x=prev+gap; x=Math.min(x,x0+L-12); xs.push(x); prev=x;});
  let ticks="";
  for(let v=0;v<=cap;v+=(cap>4000?2000:500)){const tx=x0+v*k;
    ticks+=`<line x1="${tx}" y1="${y0+10}" x2="${tx}" y2="${y0+19}" stroke="#231F1B" stroke-opacity=".5" stroke-width="1.2"/>`;
    if(!vertical)ticks+=`<text x="${tx}" y="${y0-22}" text-anchor="${v===0?"start":v===cap?"end":"middle"}" font-family="Spline Sans Mono,monospace" font-size="${o.tickFs||Math.max(14,Math.round(14*1176/Math.max(320,Math.min(innerWidth,1360)-2*Math.min(56,innerWidth*.04))))}" fill="#54504A">$${v/100}</text>`;}
  for(let i=0;i<items.length;i++){
    const x=xs[i], it=items[i];
    const len=292+((i*53)%5)*12;
    const d=digits(it.c);
    let knots="";
    d.forEach((n,lv)=>{for(let j=0;j<n;j++){
      const y=y0+LEVELS[lv]+j*7;
      knots+=it.st==="captured"
        ?`<rect x="${x-6.5}" y="${y}" width="13" height="5" rx="2.5" fill="#231F1B"/>`
        :`<rect x="${x-6.5}" y="${y}" width="13" height="5" rx="2.5" fill="#F3EFE2" stroke="#231F1B" stroke-width="1.2"/>`;
    }});
    const frayP=[-3,0,3].map(dd=>`<path d="M${x+dd} ${y0+len} l${dd*1.1} 9" stroke="#231F1B" stroke-opacity=".7" stroke-width="1.2" stroke-linecap="round"/>`).join("");
    const cls=["pen"];
    if(o.dropId===it.id)cls.push("drop");
    else if(o.settle)cls.push("settle");
    if(o.selId===it.id)cls.push("sel");
    const delay=o.settle?` style="animation-delay:${Math.min(i,5)*40}ms"`:"";
    pens+=`<g class="${cls.join(" ")}" data-id="${it.id}"${delay}>
      <rect class="body" x="${x-3.6}" y="${y0+9}" width="7.2" height="${len-9}" fill="#F3EFE2" stroke="#231F1B" stroke-width=".7"/>
      <rect x="${x-3.6}" y="${y0+9}" width="7.2" height="${len-9}" fill="url(#ply)"/>
      ${knots}${frayP}
      ${o.interactive?`<rect class="hit" data-id="${it.id}" x="${x-(vertical?22:30)}" y="${y0+9}" width="${vertical?44:60}" height="${len+10}"/>`:""}
    </g>`;
  }
  const H=y0+(items.length?292+4*12+40:78);
  const inner=`<g>${ticks}</g><g filter="url(#soft)">${loop}${pens}${main}<g>${frays}</g></g>`;
  if(vertical){
    return `<svg viewBox="0 0 ${H} ${x0+L+40}" role="img" aria-label="${esc(o.label)}" class="${o.selId?"dim":""}">${defs}<g transform="matrix(0 1 1 0 0 0)">${inner}</g></svg>`;
  }
  return `<svg viewBox="0 0 ${x0+L+40} ${H}" role="img" aria-label="${esc(o.label)}" class="${o.selId?"dim":""}">${defs}${inner}</svg>`;
}

/* slim strip: main cord only, used under the nav on other views */
function slimSVG(o){
  const s=o||sums(), k=1072/((o&&o.cap)||CAP), y=22;
  const wC=s.C*k,wA=s.A*k,wF=s.F*k, x0=0;
  const r=(x,w,f,o)=>w>0?`<rect x="${x}" y="${y-8}" width="${w}" height="16" fill="${f}" stroke="#231F1B" stroke-width=".8"/><rect x="${x}" y="${y-8}" width="${w}" height="16" fill="${o}"/>`:"";
  return `<svg viewBox="0 0 1072 44" aria-hidden="true"><defs>
    <pattern id="plyS" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#231F1B" stroke-opacity=".3" stroke-width="1.6"/></pattern>
    <pattern id="hatchS" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#231F1B" stroke-opacity=".38" stroke-width="1.2"/></pattern></defs>
    ${r(x0,wC,"#4a423a","url(#plyS)")}${r(x0+wC,wA,"#F3EFE2","url(#hatchS)")}${r(x0+wC+wA,wF,"#8C1D38","url(#plyS)")}</svg>`;
}

/* =============================================================
   Chrome
============================================================= */
const ROUTES=[["lease","Lease"],["escrow","Escrow"],["settle","Settle"],["proof","Proof"]];
function route(){const h=(location.hash||"#/").replace(/^#\/?/,"").split("?")[0];return h||"home"}
function renderNav(r){
  const cur=r==="approve"?"":r;
  $("#nav").innerHTML=ROUTES.map(([k,l])=>`<li><a href="#/${k}"${cur===k?' aria-current="page"':""}>${l}</a></li>`).join("")
   +`<li><a href="#/approve"${r==="approve"?' aria-current="page"':""}>New lease</a></li>`;
}
function slimBlock(){
  const s=sums();
  const words=S.status==="voided"?"Lease voided. Nothing is held.":`${fmt(s.F)} free to spend, ${fmt(s.A)} owed, ${fmt(s.C)} captured, of ${fmt(CAP)}.`;
  return `<div class="slimcord"><div aria-hidden="true">${slimSVG()}</div><p class="help num">${words} ${tagHtml("fixture")}</p></div>`;
}

/* =============================================================
   Views
============================================================= */
const V={};

/* ---------- lease ---------- */
V.lease=()=>{
  return `<div class="wrap"><div class="stage" id="leaseStage">
    <div class="lead" id="lead"></div>
    <aside class="honor" id="honor"></aside>
    <div class="cordwrap"><div id="cord"></div><div class="readout" id="readout" aria-live="off"></div></div>
  </div></div>
  <div class="band"><div class="wrap"><div class="stage">
    <section class="ledger" aria-labelledby="ledh"><h2 class="sec" id="ledh">The ledger, read as a table</h2><div id="ledger"></div></section>
    <section class="controls" id="controls" aria-label="Lease actions"></section>
  </div></div></div>`;
};
function paintLead(){
  const s=sums();
  const el=$("#lead"); if(!el)return;
  if(S.status==="voided"){
    el.innerHTML=`<h1>The hold is released.</h1><p class="sub">${fmt(S.voided.C)} was captured before the void. ${S.voided.A?`${fmt(S.voided.A)} owed for earlier calls cannot be collected, because PayPal refused a capture after a void ${tagHtml("measured","see Proof")}. `:""}The rest of the ${fmt(CAP)} hold went back to your PayPal. ${tagHtml("fixture")}</p>`;
    return;
  }
  el.innerHTML=`<h1><span class="num">${fmt(s.F)}</span> is free to spend.</h1>
   <p class="sub">You approved ${fmt(CAP)} once. Your agent has captured ${fmt(s.C)}${s.A?` and owes ${fmt(s.A)} more that is still held, not yet captured`:""}. The gateway refuses any call that would pass the cap. ${tagHtml("fixture")}</p>`;
}
function paintHonor(){
  const el=$("#honor"); if(!el)return;
  // fixture clock: hour 9 of a 72 hour honor period, day 4 opens the reauthorize window (assumed)
  const pct=h=>(h/96*100).toFixed(1)+"%";
  el.innerHTML=`<h2>72 hour honor period, then best effort</h2>
   <div class="rulebar" aria-hidden="true"><i style="left:0;width:${pct(72)}"></i><b style="left:0"></b><b style="left:${pct(72)}"></b><em style="left:${pct(72)};width:${(100-72/96*100).toFixed(1)}%"></em><b style="left:${pct(9)};top:2px;height:25px;width:3px"></b></div>
   <p class="help">Hour 9 of 72. Day 4 opens a reauthorize window that PayPal says is allowed once. ${tagHtml("fixture","fixture clock")} ${tagHtml("computed","proposal, not verified")}</p>`;
}
// after a void the uncaptured pendants have no cord to hang from, so only captured ones stay drawn
function itemsForLease(){return S.calls.filter(k=>S.status==="voided"?k.st==="captured":true).slice(0,NSLOT)}
function isVertical(){return matchMedia("(max-width:720px)").matches}
let dropId=null;
function paintCord(opts={}){
  const el=$("#cord"); if(!el)return;
  const s=sums();
  const items=itemsForLease();
  const rel=S.voided||{A:0,F:0};
  el.innerHTML=cordSVG({items,cap:CAP,C:s.C,A:s.A,F:s.F,vertical:isVertical(),voided:S.status==="voided",
    relA:rel.A,relF:rel.F,animCut:opts.cut,dropId:opts.dropId,selId:S.ui.sel,settle:S.ui.firstPaint,interactive:true,
    label:S.status==="voided"?"The lease cord, cut. The released length is gone.":`The lease as a knotted cord. ${items.length} calls tied. ${fmt(s.F)} free, ${fmt(s.A)} owed, ${fmt(s.C)} captured.`});
  S.ui.firstPaint=false;
  paintReadout();
}
function paintReadout(){
  const el=$("#readout"); if(!el)return;
  const k=S.calls.find(c=>c.id===S.ui.sel);
  if(!k){el.innerHTML=`<span class="help">Each pendant is one paid call. Knots by decimal place: tens, dollars, dimes, cents. Solid knots are captured, outlined knots are owed. Hover or tap a pendant to read it.</span>`;return}
  el.innerHTML=`<strong>Call ${k.id}, ${esc(k.tool)}</strong><span class="num">${fmt(k.c)}</span><span>${k.st}</span><span class="num">${k.t}</span>${tagHtml("fixture")}`;
}
function paintLedger(){
  const el=$("#ledger"); if(!el)return;
  const s=sums();
  if(!S.calls.length){
    el.innerHTML=`<div class="empty"><p><strong>No calls yet.</strong> Each paid call your agent makes ties one pendant onto the cord and takes its price out of the free length.</p><p class="help" style="margin-top:12px">Press Let the agent spend to watch the first one.</p></div>`;
    return;
  }
  const rows=S.calls.map(k=>`<tr class="${S.ui.sel===k.id?"sel":""}" data-id="${k.id}">
    <td><button class="rowbtn" data-sel="${k.id}" aria-pressed="${S.ui.sel===k.id}"><span class="num">${String(k.id).padStart(2,"0")}</span><span>${esc(k.tool)}</span></button></td>
    <td class="num r">${fmt(k.c)}</td><td>${k.st}</td><td class="num r">${k.t}</td></tr>`).join("");
  el.innerHTML=`<div class="wide"><table><caption class="sr">Paid calls on this lease, fixture data</caption>
   <thead><tr><th scope="col">Call</th><th scope="col" class="r">Price</th><th scope="col">State</th><th scope="col" class="r">Time</th></tr></thead>
   <tbody>${rows}</tbody>
   <tfoot><tr><td>Captured</td><td class="num r">${fmt(s.C)}</td><td colspan="2"></td></tr>
   <tr><td>Owed, not captured</td><td class="num r">${fmt(s.A)}</td><td colspan="2"></td></tr>
   <tr><td>Free to spend</td><td class="num r">${fmt(s.F)}</td><td colspan="2"></td></tr></tfoot></table></div>
   <ul class="log" aria-label="Gateway log">${S.log.slice(-4).reverse().map(l=>`<li><time>${l.t}</time><span>${esc(l.m)}</span></li>`).join("")}</ul>
   <p class="help" style="margin-top:12px">${tagHtml("fixture","fixture ledger")} Prices and tool names are sample data. Real captures are on Proof.</p>`;
}
function paintControls(){
  const el=$("#controls"); if(!el)return;
  const s=sums();
  if(S.status==="voided"){
    el.innerHTML=`<p><strong>This lease is voided.</strong> Spending is closed.</p><a class="btn fill" href="#/approve">Start a new lease</a>`;
    return;
  }

  if(!S.ui.voidOpen){
    html+=`<div><button class="btn" id="voidOpen">Void lease</button><p class="help" style="margin-top:8px">Releases the hold at PayPal. You confirm with the amount first.</p></div>`;
  }else{

      <p style="margin-top:8px">${s.A?`${fmt(s.A)} of it is owed for calls already made. PayPal refuses a capture after a void ${tagHtml("measured","422 AUTHORIZATION_VOIDED")}, so settle first if you want that paid. `:""}This cannot be undone.</p>
      ${s.A?`<p style="margin-top:8px"><a href="#/settle">Settle ${fmt(s.A)} first</a></p>`:""}
      <div class="field"><label for="vin">Type <span class="num">${(held/100).toFixed(2)}</span> to confirm</label><input id="vin" type="text" inputmode="decimal" autocomplete="off" aria-describedby="vhelp"></div>

  }
  const keep=document.activeElement&&el.contains(document.activeElement)?document.activeElement.id:"";
  el.innerHTML=html;
  if(keep)document.getElementById(keep)?.focus({preventScroll:true});
}
function paintLease(opts){paintLead();paintHonor();paintCord(opts);paintLedger();paintControls()}

/* agent */
function spend(){
  if(S.status!=="active")return false;
  const s=sums();
  const [tool,c]=QUEUE[S.q%QUEUE.length]; S.q++;
  S.clock+=1+((S.nextId*7)%3);
  const t=clockStr(S.clock);
  const TOOLCAT={"web.search":"Data and search","filings.fetch":"Data and search","flights.search":"Data and search","pdf.extract":"Documents","summarize.long":"Documents","maps.route":"Maps","geocode.batch":"Maps","translate.es":"Translation"};
  if(S.rules&&TOOLCAT[tool]&&!S.rules.cats.includes(TOOLCAT[tool])){
    S.refused++; S.log.push({t,m:"Refused "+tool+". "+TOOLCAT[tool]+" is not on your allowed list."}); say("Gateway refused "+tool+". Not on your allowed list."); stopRun(); paintLease(); return false;
  }
  if(S.rules&&c>S.rules.per){
    S.refused++; S.log.push({t,m:"Refused "+tool+" at "+fmt(c)+". Your per-call ceiling is "+fmt(S.rules.per)+"."}); say("Gateway refused "+tool+". Above your per-call ceiling."); stopRun(); paintLease(); return false;
  }
  if(c>s.F){
    S.refused++;
    S.log.push({t,m:`Refused ${tool} at ${fmt(c)}. It would pass the cap; ${fmt(s.F)} is free.`});
    say(`Gateway refused ${tool}. It would pass the cap.`);
    stopRun(); paintLease(); return false;
  }
  if(S.calls.filter(k=>k.st!=="refused").length>=NSLOT){stopRun();S.log.push({t,m:"The cord has no free slot. Settle, then start another lease."});paintLease();return false}
  const k={id:S.nextId++,tool,c,st:"accrued",t};
  S.calls.push(k); S.log.push({t,m:`Spent ${fmt(c)} on ${tool}.`}); S.ui.sel=null;
  say(`Spent ${fmt(c)} on ${tool}. ${fmt(sums().F)} free.`);
  paintLease({dropId:k.id});
  return true;
}
function startRun(){if(S.running||S.ui.voidOpen)return;S.running=true;S.timer=setInterval(()=>{if(!spend())return},1500);paintControls()}
function stopRun(){S.running=false;clearInterval(S.timer);S.timer=null}

/* ---------- escrow ---------- */
const VERD=[["Not met",0],["Partly met",1],["Met",2]];
const SHARE=[0,60,100];
const ESCROW=250;
function effective(v,sc){let e=v; if(e===2&&sc<70)e=1; if(e>=1&&sc<40)e=0; return e}
function escrowCalc(){
  const a=S.ui.esc.a,b=S.ui.esc.b;
  const ea=effective(a.v,a.s), eb=effective(b.v,b.s);
  const gap=Math.abs(ea-eb);
  if(gap===2)return {ea,eb,held:true,pay:0,rule:"Met against Not met is a split. The money stays in escrow for appeal.",twist:0};
  const e=Math.min(ea,eb);
  const pay=Math.floor(ESCROW*SHARE[e]/100);
  return {ea,eb,held:false,pay,share:SHARE[e],rule:gap===0?"The judges agree, so the rubric share applies.":"The judges differ by one step, so the lower verdict pays.",twist:1};
}
V.escrow=()=>{
  const a=S.ui.esc.a,b=S.ui.esc.b;
  const judge=(key,label,j)=>`<div class="judge"><h3 id="j${key}">${label}</h3>
    <div class="seg" role="radiogroup" aria-labelledby="j${key}">${VERD.map(([n,v])=>`<button role="radio" tabindex="${j.v===v?0:-1}" aria-checked="${j.v===v}" data-j="${key}" data-v="${v}">${n}</button>`).join("")}</div>
    <div class="scorerow"><label for="sc${key}">Score</label><input type="range" id="sc${key}" data-sc="${key}" min="0" max="100" value="${j.s}"><span class="num" id="scv${key}" style="min-width:2.5ch;text-align:right">${j.s}</span></div></div>`;
  return `<div class="wrap">${slimBlock()}<div class="two"><div class="title-block">
    <h1>Two judges propose. The database pays.</h1>
    <p class="sub">The buyer set the rubric before the job began. A judge may only answer with a verdict from a fixed list and a score. No model ever writes an amount.</p>
    ${judge("a","Judge A, provider one",a)}${judge("b","Judge B, provider two",b)}
    <p class="help" style="margin-top:16px">${tagHtml("fixture")} The job, the verdicts and the $2.50 escrow are sample data. The mapping below is real logic from the kernel's rule, run in your browser.</p>
  </div><div id="escOut"></div></div></div>`;
};
function plySVG(tw,pay){
  const W=700,H=210,mid=96,X1=470,wl=64;
  const sm=v=>{v=Math.max(0,Math.min(1,v));return v*v*(3-2*v)};
  const path=(sgn,ph)=>{let d="";for(let x=0;x<=X1;x+=4){
    const conv=tw*sm((x-110)/280), sep=42*(1-conv), amp=6+conv*10;
    const y=mid+sgn*sep+amp*Math.sin(x/wl*Math.PI*2+ph);d+=(x?"L":"M")+x+" "+y.toFixed(1)+" "}return d};
  const strand=(d,fill)=>`<path d="${d}" fill="none" stroke="#231F1B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${fill}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#231F1B" stroke-opacity=".3" stroke-width="9" stroke-dasharray="1.5 6"/>`;
  const frayEnd=y=>[-4,0,4].map(d=>`<path d="M${X1+2} ${y} l11 ${d*1.5}" stroke="#231F1B" stroke-width="1.3" stroke-linecap="round"/>`).join("");
  const out=tw>0?`<path d="M${X1} ${mid} L${W-12} ${mid}" stroke="#231F1B" stroke-width="14" stroke-linecap="round"/><path d="M${X1} ${mid} L${W-12} ${mid}" stroke="#F3EFE2" stroke-width="10" stroke-linecap="round"/><path d="M${X1} ${mid} L${W-12} ${mid}" stroke="#231F1B" stroke-opacity=".3" stroke-width="10" stroke-dasharray="1.5 6"/>`:"";
  let kn=""; if(tw>0){digits(pay).forEach((n,lv)=>{for(let j=0;j<n;j++)kn+=`<rect x="${X1+34+lv*48+j*6}" y="${mid-11}" width="4.5" height="22" rx="2" fill="#231F1B"/>`})}
  const fr=tw>0?"":frayEnd(mid-42)+frayEnd(mid+42);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Two judge strands. ${tw>0?"They agree enough to twist into one cord, and the payout is tied on it as knots.":"They split and stay apart, so no payout is tied."}"><defs><filter id="sf" x="-5%" y="-10%" width="110%" height="140%"><feDropShadow dx="0" dy="2.5" stdDeviation="1.6" flood-color="#231F1B" flood-opacity=".3"/></filter></defs><g filter="url(#sf)">${strand(path(1,Math.PI),"#F3EFE2")}${strand(path(-1,0),"#4a423a")}${out}${kn}${fr}</g></svg>`;
}
function paintEscrow(){
  const el=$("#escOut"); if(!el)return;
  const r=escrowCalc(), a=S.ui.esc.a,b=S.ui.esc.b;
  const nm=i=>VERD[i][0];
  const note=(j,e,key)=>j.v!==e?`Judge ${key} said ${nm(j.v)} with ${j.s}. The rubric needs ${j.v===2?"70":"40"} or more, so the kernel counts it as ${nm(e)}.`:"";
  el.innerHTML=`<div class="ply-out">${plySVG(r.twist,r.pay)}</div>
   <div class="kernel"><h2 style="font-size:1.25rem;letter-spacing:-.01em">What the kernel does with it ${tagHtml("computed","computed in your browser")}</h2>
    <dl><dt>Judge A counts as</dt><dd>${nm(r.ea)}</dd><dt>Judge B counts as</dt><dd>${nm(r.eb)}</dd><dt>Escrow</dt><dd class="num">${fmt(ESCROW)} ${tagHtml("fixture")}</dd></dl>
    <p style="margin-top:12px">${r.rule}</p>
    ${[note(a,r.ea,"A"),note(b,r.eb,"B")].filter(Boolean).map(t=>`<p class="help" style="margin-top:8px">${t}</p>`).join("")}
    <div class="payout num" role="status">${r.held?`${fmt(ESCROW)} held`:`${fmt(r.pay)} to the seller`}</div>
    <p class="help" style="margin-top:8px">${r.held?"Nobody is paid until an appeal resolves it.":`${fmt(ESCROW-r.pay)} would go back to the lease as free length. This prototype does not move it.`}</p>
    <p class="help" style="margin-top:12px">${tagHtml("fixture","fixture rubric")} The shares and score thresholds below are sample choices a buyer would set.</p>
    <pre class="rule" tabindex="0" aria-label="The rubric as code">rubric  Met 100%  Partly met 60%  Not met 0%
Met needs score &gt;= 70, Partly needs &gt;= 40
agree -> share   differ by 1 -> lower pays
Met vs Not met -> hold for appeal
amount = floor(escrow * share / 100)</pre></div>`;
}

function groupsFor(items,n){
  const m=items.length,base=Math.floor(m/n),extra=m%n,g=[];let i=0;
  for(let j=0;j<n;j++){const sz=base+(j<extra?1:0);g.push(items.slice(i,i+sz));i+=sz}return g;
}

function progressCord(step,total){
  const W=150,gap=W/(total-1);let k="";
  for(let i=0;i<total;i++){const x=6+i*(W-12)/(total-1);
    k+=i<step-1?`<rect x="${x-4}" y="5" width="8" height="18" rx="2" fill="#231F1B"/>`
     :i===step-1?`<rect x="${x-4}" y="5" width="8" height="18" rx="2" fill="#F3EFE2" stroke="#231F1B" stroke-width="1.5"/>`
     :`<rect x="${x-4}" y="6" width="8" height="16" rx="2" fill="none" stroke="#231F1B" stroke-opacity=".4" stroke-dasharray="2 2"/>`;}
  return `<svg viewBox="0 0 ${W} 28" aria-hidden="true"><rect x="0" y="10" width="${W}" height="8" fill="#F3EFE2" stroke="#231F1B" stroke-width=".8"/><rect x="0" y="10" width="${W}" height="8" fill="url(#plyP)"/><defs><pattern id="plyP" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#231F1B" stroke-opacity=".3" stroke-width="1.6"/></pattern></defs>${k}</svg>`;
}

function heroTick(){
  const step=HERO[HD.i%HERO.length];
  let C=0,A=0; HD.items.forEach(k=>{k.st==="captured"?C+=k.c:A+=k.c});
  if(step==="CAPTURE"){
    HD.items.forEach(k=>k.st="captured"); HD.drop=null;
    HD.note=`<strong>Settled in one capture.</strong> <span class="num">${fmt(A)}</span> <span>fee ${fmt(feeC(A))} instead of ${fmt(HD.items.filter(k=>k.st==="captured").slice(-4).reduce((a,k)=>a+feeC(k.c),0))} one by one</span> ${tagHtml("computed")}`;
  }else{
    const [tool,c]=step, F=2000-C-A;
    if(c>F){HD.note=`<strong>Refused.</strong> <span>${tool} at <span class="num">${fmt(c)}</span> would pass the cap. <span class="num">${fmt(F)}</span> stays free.</span> ${tagHtml("fixture")}`;heroPaint();clearInterval(HD.timer);HD.timer=setTimeout(()=>{HD.items=[];HD.i=0;HD.note="";HD.drop=null;heroPaint(true);heroStart()},4200);return}
    const k={id:HD.items.length+1,tool,c,st:"accrued"}; HD.items.push(k); HD.drop=k.id;
    HD.note=`<span>Agent paid <span class="num">${fmt(c)}</span> for ${tool}.</span> <span class="num">${fmt(F-c)}</span> <span>free</span> ${tagHtml("fixture")}`;

}

  if(reduced()){ // a still frame at the moment of refusal
    HD.items=[{id:1,tool:"flights.search",c:120,st:"captured"},{id:2,tool:"pdf.extract",c:75,st:"captured"},{id:3,tool:"geocode.batch",c:250,st:"captured"},{id:4,tool:"filings.fetch",c:300,st:"captured"},{id:5,tool:"summarize.long",c:475,st:"accrued"},{id:6,tool:"summarize.long",c:475,st:"accrued"}];
    HD.note=`<strong>Refused.</strong> <span>summarize.long at <span class="num">$4.75</span> would pass the cap. <span class="num">$3.05</span> stays free.</span> ${tagHtml("fixture")}`;heroPaint();return}
  HD.timer=setInterval(heroTick,1250);
}

function howPaint(i){
  const [name,txt,vis,cap]=HOW[i];
  $("#howbody").innerHTML=`<h3>${name}</h3><p>${txt}</p>`;
  $("#howvis").innerHTML=`${vis()}<p class="cap">${cap}</p>`;
  document.querySelectorAll("#tabs button").forEach((b,j)=>{b.setAttribute("aria-selected",String(j===i));b.tabIndex=j===i?0:-1});
}
const FAQ=[
 ["Does my agent ever see my card?","No. Your agent gets a gateway token. The card stays with PayPal, and you approve the hold on PayPal's own page. Voiding the lease is designed to cut a token off. In this prototype that path is a fixture."],
 ["What if my agent tries to overspend?","The gateway checks every call against your cap and your per-call ceiling before anything is charged. A limit written into a prompt is text a model can misread or be argued out of. This one is a check in the payment path."],
 ["What happens after 72 hours?","PayPal documents a three day honor period for a hold. After that it is best effort, and PayPal's own error text says a reauthorize is allowed once, from day 4 to day 29. We do not promise more than that. Day 4 behavior is not tested yet."],
 ["Why not just give my agent a virtual card?","Agent cards with limits are real and useful. Pashadhara is for people who want the hold on their own PayPal account, with capture batching, escrow for judged work and a one step void in one ledger."],
 ["What if PayPal does not answer?","The state becomes unknown. We read PayPal before any retry, so a slow call should never turn into a double charge. That is the design, and it is not proven end to end yet."],
 ["Is this live?","No. This is a sandbox prototype. No real money moves, and every number on a screen says whether it was measured, computed or is a fixture."]
];

<section class="hero"><div class="wrap">

</section>
</div></section>

<section class="why sect" id="why" style="margin-top:var(--s9)"><div class="wrap">
  <h2 class="big2">Agents can pay now. Most people do not trust them to.</h2>
  <div class="gap">
    <div class="gapi"><div class="gapn">72%</div><p class="muted">of 2,065 US consumers had used an AI assistant to shop.</p></div>
    <div class="gapi"><div class="gapn">23%</div><p class="muted">trust AI to manage their payments.</p></div>
  </div>
  <div class="tcs" aria-hidden="true"><div class="tcord" style="--p:72"></div><div class="tcord hot" style="--p:23"></div></div>
  <p class="src">Visa Trust Index, fieldwork late May 2026, reported by <a href="https://enterprisedna.co/resources/news/visa-trust-index-agentic-commerce-consumer-payments-2026/" target="_blank" rel="noopener">Enterprise DNA</a>. Visa sponsored the survey.</p>
  <h3 class="pivot">A separate survey, across six markets, asked what people would need.</h3>
  <div class="asks">
    <div><div class="n">30%</div><p>name spending caps as a non negotiable.</p></div>
    <div><div class="n">29%</div><p>name instant revocation.</p></div>
    <div><div class="n">28%</div><p>name easy cancellation.</p></div>
  </div>
  <p class="src">Checkout.com consumer research across six markets, <a href="https://www.checkout.com/newsroom/consumer-demand-for-ai-shopping-is-forming-fast-but-trust-for-agentic-commerce-is-still-catching-up" target="_blank" rel="noopener">press release</a>. It does not state the sample size, and it is a different survey from the Visa one above. 27% said they trust no organization to run an AI shopping agent.</p>
  <p class="pivot" style="margin-top:var(--s7)">Pashadhara is built around those three controls, checked outside the model.</p>
</div></section>

<section class="own sect"><div class="wrap">
  <h2 class="big2">We measured the other half.</h2>
  <p class="lede">Controls are only worth having if the money moves the way you expect. These come from our own PayPal sandbox log, not from a brochure.</p>
  <div class="pair">
    <div><div class="n">$6.24</div><p>fees on twelve $1.00 captures of one authorization ${tagHtml("measured")}</p></div>
    <div><div class="n">$0.91</div><p>fee on one $12.00 capture, from the same fee model ${tagHtml("computed")}</p></div>
    <div><div class="n">422</div><p>what PayPal answered when we tried to capture after a void ${tagHtml("measured")}</p></div>
  </div>
  <p style="margin-top:var(--s6)"><a href="#/" data-act="sample-proof">Read the twelve raw rows</a> · <a href="finance.html">See the recorded finance investigation</a></p>
</div></section>

<section class="sect" id="how"><div class="wrap">

    <div><div class="tabs" id="tabs" role="tablist" aria-label="How it works">${HOW.map((h,i)=>`<button role="tab" id="tab${i}" aria-selected="${i===0}" tabindex="${i===0?0:-1}" data-act="how" data-i="${i}" aria-controls="howbody">${h[0]}</button>`).join("")}</div>
      <div class="body" id="howbody" style="margin-top:var(--s6)" role="tabpanel" aria-live="polite" aria-labelledby="tab0"></div></div>
    <div class="stage-v" id="howvis"></div>
  </div>
</div></section>

<section class="limits sect" id="limits"><div class="wrap">
  <h2 class="big2">What it cannot promise, said plainly.</h2>
  <p class="lede">PayPal has no agent wallet. We build on an authorization hold, and a hold has limits we would rather you read here than discover later.</p>
  <div class="cols">
    <div><h3>The database enforces</h3><ul>
      <li>Your cap and your per-call ceiling, checked on every call.</li>
      <li>Every amount. Money is whole cents and no model chooses one.</li>
      <li>Escrow payouts, from the rubric you set before the job.</li>
      <li>A void you confirm by typing the held amount.</li></ul></div>
    <div><h3>PayPal decides</h3><ul>
      <li>A hold is honored for about 72 hours, then it is best effort ${tagHtml("documented","from PayPal docs")}</li>
      <li>Reauthorize is allowed once, from day 4 to day 29 ${tagHtml("measured","wording of a 422 response")}</li>
      <li>PayPal's default overage limit is 115% of an order, so the 100% line is our own cap, not PayPal's.</li>
      <li>A $1.00 sandbox payout reached SUCCESS 24 seconds after it was created ${tagHtml("measured")}</li>
      <li>An authorization carries an expiry time 29 days after it was created ${tagHtml("measured")}</li>
      <li>Not proven yet: reauthorize on day 4 and capture after day 3.</li>
      <li>If PayPal does not answer, the state is unknown until we read it.</li></ul></div>
  </div>
</div></section>

<section class="sect"><div class="wrap">
  <h2 class="big2">Built for the people who hand agents tools.</h2>
  <div class="bento">
    <div class="b1"><h3>Builders shipping an agent that pays</h3><p>Give it a gateway token and a limit instead of a card. Watch every call tie onto the cord as it happens.</p></div>

</div></section>

    <li><a href="https://www.checkout.com/newsroom/consumer-demand-for-ai-shopping-is-forming-fast-but-trust-for-agentic-commerce-is-still-catching-up" target="_blank" rel="noopener">Checkout.com consumer research</a>. Six markets. 30% spending caps, 29% instant revocation, 28% easy cancellation, 27% trust no organization. The page gives no sample size and its dates disagree, so treat it as directional.</li>

let resendTimer=null;
function startResend(){clearInterval(resendTimer);S.su.resend=20;resendTimer=setInterval(()=>{if(S.su.resend>0)S.su.resend--;const b=$("#resend");if(b){if(S.su.resend>0){b.setAttribute("aria-disabled","true");b.textContent=`Send a new code in ${S.su.resend}s`}else{b.removeAttribute("aria-disabled");b.textContent="Send a new code"}}if(S.su.resend<=0)clearInterval(resendTimer)},1000)}
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function suGo(step){S.su.step=step;S.su.err={};S.su.codeErr="";paintFlow("h1");window.scrollTo(0,0)}
function verifyCode(){
  const vals=[...document.querySelectorAll("#cboxes input")].map(i=>i.value).join("");
  if(vals.length<6)return;
  if(vals==="123456"){
    S.su.codeErr="";
    if(S.su.mode==="login"){const n=S.su.email.split("@")[0].replace(/[._-]+/g," ");S.user={name:n.replace(/\b\w/g,c=>c.toUpperCase()),email:S.su.email};resetSample();location.hash="#/lease";say("Logged in.")}
    else suGo(3);
  }else{S.su.codeErr="That code does not match. Check the newest email, or send a new code.";paintFlow();const f=$("#cboxes input");f&&f.focus()}
}
function siteClick(e){
  const el=e.target.closest("[data-scroll],[data-act]"); if(!el)return false;
  const sc=el.dataset.scroll;
  if(sc){e.preventDefault();const t=document.getElementById(sc);if(t)t.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"start"});return true}
  const a=el.dataset.act, s=S.su;
  if(el.getAttribute("aria-disabled")==="true"&&a!=="how"){e.preventDefault();return true}
  switch(a){
    case "sample": case "sample-proof": e.preventDefault(); resetSample(); S.user={name:"Sample",sample:true}; location.hash=a==="sample"?"#/lease":"#/proof"; return true;
    case "signout": stopRun(); S.user=null; S.su=suFresh("signup"); location.replace("#/"); say("Signed out."); return true;
    case "hero-pause": {const p=!HD.paused;HD.paused=p;if(p){heroStop();el.textContent="Play the demo"}else{heroStart();el.textContent="Pause the demo"}el.setAttribute("aria-pressed",String(p));return true}
    case "how": howPaint(+el.dataset.i); el.focus(); return true;
    case "su-back": if(s.paypal==="busy"||s.approve==="busy")return true; if(s.step===2){clearInterval(resendTimer)} suGo(s.mode==="login"?1:Math.max(1,s.step-1)); return true;
    case "su-resend": startResend(); say("A new code was sent."); paintFlow("#resend"); return true;
    case "su-next": suGo(s.step+1); return true;
    case "su-paypal": if(s.paypal==="busy")return true; s.paypal="busy"; paintFlow("#ppGo"); setTimeout(()=>{if(S.su.paypal!=="busy"||current!=="flow")return;S.su.paypal="done";paintFlow("h1");say("PayPal connected.")},1200); return true;
    case "su-paypal-no": if(s.paypal==="busy")return true; s.paypal="declined"; paintFlow("#ppGo"); return true;
    case "su-paypal-reset": s.paypal="idle"; paintFlow("#ppGo"); return true;
    case "su-cap": s.cap=+el.dataset.v; s.customCap=""; s.err.cap=""; if(s.per>s.cap)s.per=Math.min(500,s.cap); paintFlow(`[data-act="su-cap"][data-v="${el.dataset.v}"]`); return true;
    case "su-per": s.per=+el.dataset.v; paintFlow(`[data-act="su-per"][data-v="${el.dataset.v}"]`); return true;
    case "su-cat": {const c=el.dataset.v;s.cats=s.cats.includes(c)?s.cats.filter(x=>x!==c):[...s.cats,c];s.err.cats="";paintFlow(`[data-act="su-cat"][data-v="${c}"]`);return true}
    case "su-rules": {
      s.err={};
      if(s.customCap){const n=Number(s.customCap);if(!Number.isInteger(n)||n<5||n>200){s.err.cap="Type a whole number of dollars from 5 to 200, or pick one above.";paintFlow("#capC");return true}s.cap=n*100;if(s.per>s.cap)s.per=Math.min(500,s.cap)}
      if(!s.cats.length){s.err.cats="Choose at least one kind of tool, or the agent could buy nothing.";paintFlow();return true}
      suGo(5); return true;}
    case "su-approve": if(s.approve==="busy")return true; s.approve="busy"; paintFlow("#apGo"); setTimeout(()=>{if(S.su.approve!=="busy"||current!=="flow")return;S.su.approve="done";suGo(6);say("Approved. "+fmt(S.su.cap)+" is held.")},1200); return true;
    case "su-approve-no": if(s.approve==="busy")return true; s.approve="declined"; paintFlow("#apGo"); return true;
    case "su-reveal": s.reveal=!s.reveal; paintFlow('[data-act="su-reveal"]'); return true;
    case "su-copy": {const txt=`{\n  "mcpServers": {\n    "pashadhara": {\n      "type": "http",\n      "url": "${MCP_URL}",\n      "headers": { "Authorization": "Bearer ${TOKEN}" }\n    }\n  }\n}`;
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).catch(()=>{}).finally(()=>{s.copied=true;paintFlow('[data-act="su-copy"]');say("Settings copied.");setTimeout(()=>{S.su.copied=false;if(current==="flow"&&S.su.step===6)paintFlow()},2500)}); return true}
    case "su-test": if(s.test==="busy")return true; s.test="busy"; paintFlow('[data-act="su-test"]'); setTimeout(()=>{if(S.su.test!=="busy"||current!=="flow")return;S.su.test="ok";paintFlow('[data-act="su-test"]');say("The gateway answered.")},900); return true;
    case "su-finish": {
      CAP=s.cap; S.user={name:s.name||"You",email:s.email}; S.status="active"; S.calls=[]; S.q=0; S.nextId=1; S.clock=9*60; S.log=[]; S.refused=0; S.settles=[]; S.voided=null;
      S.rules={per:Math.min(s.per,s.cap),cats:[...s.cats]}; S.ui.sel=null; S.ui.firstPaint=false; S.ui.settleDone=null; S.ui.settleN=null; S.ui.voidOpen=false; stopRun();
      location.hash="#/lease"; say("Your lease is open."); return true;}
  }
  return false;
}
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]"); if(!f)return; e.preventDefault();
  if(f.dataset.form==="su1"){
    const s=S.su, login=s.mode==="login"; s.err={};
    s.name=($("#suName")?.value||"").trim(); s.email=($("#suEmail")?.value||"").trim();
    if(!login&&!s.name)s.err.name="Tell us what to call you. A first name is enough.";
    if(!EMAIL_RE.test(s.email))s.err.email=s.email?"That email looks incomplete. It should look like name@example.com.":"Enter the email we should send the code to.";
    if(s.err.name||s.err.email){paintFlow(s.err.name?"#suName":"#suEmail");return}

document.addEventListener("input",e=>{

document.addEventListener("paste",e=>{

  const d=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6); if(!d)return; e.preventDefault();

document.addEventListener("keydown",e=>{
  const tl=e.target.closest&&e.target.closest("[role=tablist]");
  if(tl&&["ArrowLeft","ArrowRight","Home","End"].includes(e.key)){const b=[...tl.querySelectorAll("[role=tab]")],i=b.indexOf(e.target);if(i>-1){e.preventDefault();const n=e.key==="Home"?0:e.key==="End"?b.length-1:(i+(e.key==="ArrowRight"?1:b.length-1))%b.length;howPaint(n);b[n].focus();return}}
  const t=e.target; if(!(t.dataset&&t.dataset.ci!==undefined))return;
  const all=[...document.querySelectorAll("#cboxes input")], i=+t.dataset.ci;
  if(e.key==="Backspace"&&!t.value&&all[i-1]){all[i-1].focus();all[i-1].value=""}
  if(e.key==="ArrowLeft"&&all[i-1]){e.preventDefault();all[i-1].focus()}
  if(e.key==="ArrowRight"&&all[i+1]){e.preventDefault();all[i+1].focus()}
});

let current="";
function mount(){
  const r=route();
  const v=(r==="home")?"home":(r==="signup"||r==="login")?"flow":(APP_ROUTES.includes(r)?r:"home");
  if(APP_ROUTES.includes(v)&&!S.user){location.replace("#/");return}
  if(S.status==="none"&&["lease","escrow","settle"].includes(v)){location.replace("#/approve");return}
  if(current!==v){stopRun();S.ui.voidOpen=false;heroStop();clearInterval(resendTimer);if(S.ui.approve==="loading"){clearTimeout(S.approveTimer);S.ui.approve="idle"}}
  if(v==="flow"&&(current!=="flow"||S.su.mode!==r))S.su=suFresh(r);
  {const m=location.hash.match(/step=([1-6])/);if(v==="flow"&&m&&!mount.once){S.su.step=+m[1];S.su.name="Nikhil";S.su.email="nikhil@example.com";S.su.paypal="done"}}
  current=v;
  const mode=v==="home"?"site":v==="flow"?"flow":"app";
  document.body.classList.toggle("lease",v==="lease");
  const main=$("#main");
  if(v==="home"){renderChrome("site",v);document.title="Pashadhara | A budget your agent cannot break";main.innerHTML=V.home();initHome();document.querySelector('#replayBoundary').onclick=()=>{const receipt=document.querySelector('#boundaryReceipt');if(!receipt.hidden)return;receipt.hidden=false;receipt.style.display='';receipt.innerHTML='<strong>Refused · $0.01 over the limit</strong><p>Tool did not run. $0.00 charged. $0.06 remained available.</p><a href="../../apps/web/public/finance-paypal-proof.json">Open the journal and PayPal read</a>';const strike=document.createElement('span');strike.className='strike';document.querySelector('.instrument .rail').append(strike)}}
  else if(v==="flow"){main.innerHTML=V.flow();paintFlow(mount.once?"h1":null)}
  else{
    renderChrome("app",v);
    document.title=({lease:"Lease",approve:"New lease",escrow:"Escrow",settle:"Settle",proof:"Proof"})[v]+" | Pashadhara";
    main.innerHTML=V[v]();
    if(v==="lease")paintLease();
    if(v==="escrow")paintEscrow();
    if(v==="settle")paintSettle();
  }
  window.scrollTo(0,0);
  if(mount.once&&v!=="flow")main.focus({preventScroll:true});
  mount.once=true;
}
window.addEventListener("hashchange",mount);
let lastVertical=isVertical();
addEventListener("resize",()=>{const v=isVertical();if(v!==lastVertical){lastVertical=v;mount()}});

document.addEventListener("click",e=>{
  if(siteClick(e))return;
  const t=e.target;
  const sel=t.closest("[data-sel]");
  if(sel){const id=+sel.dataset.sel;S.ui.sel=S.ui.sel===id?null:id;paintCord();paintLedger();return}
  const pen=t.closest(".pen[data-id]");
  if(pen&&$("#cord")&&$("#cord").contains(pen)){const id=+pen.dataset.id;S.ui.sel=S.ui.sel===id?null:id;paintCord();paintLedger();return}
  const id=t.closest("[id]")?.id;
  switch(t.closest("button")?.id){
    case "run": S.running?(stopRun(),paintControls()):startRun(); break;
    case "one": spend(); break;
    case "voidOpen": stopRun(); S.ui.voidOpen=true; paintControls(); $("#vin")?.focus(); break;
    case "voidCancel": S.ui.voidOpen=false; paintControls(); $("#voidOpen")?.focus(); break;
    case "voidGo": {
      if(t.closest("button").getAttribute("aria-disabled")==="true")break;
      const s=sums(); S.voided={C:s.C,A:s.A,F:s.F};
      S.calls.forEach(k=>{if(k.st==="accrued")k.st="voided"});
      S.status="voided"; S.ui.voidOpen=false; S.ui.sel=null; stopRun();
      say("Lease voided. The hold is released.");
      // recompute so the cord shows the cut
      paintLead();paintHonor();paintCord({cut:true});paintLedger();paintControls();
      $("#lead h1")?.setAttribute("tabindex","-1"); $("#lead h1")?.focus();
      break;}
    case "approveGo": if(S.ui.approve==="loading")break; S.ui.approve="loading"; $("#main").innerHTML=V.approve();
      S.approveTimer=setTimeout(()=>{if(S.ui.approve!=="loading")return;S.status="active";S.calls=[];S.q=0;S.nextId=1;S.clock=9*60;S.log=[];S.settles=[];S.voided=null;S.ui.approve="idle";S.ui.sel=null;S.ui.settleDone=null;S.ui.settleN=null;S.ui.firstPaint=false;
        say("Approved. "+fmt(CAP)+" is held.");location.hash="#/lease";if(route()==="lease")mount();},1100); break;
    case "approveNo": if(S.ui.approve==="loading")break; S.ui.approve="declined"; $("#main").innerHTML=V.approve(); $("#approveGo").focus(); break;
    case "resetAll": S.status="none";S.ui.approve="idle";S.calls=[];S.voided=null;stopRun();$("#main").innerHTML=V.approve();renderNav("approve");break;
    case "fewest": if(t.closest("button").getAttribute("aria-disabled")==="true")break; S.ui.settleN=1; $("#nr").value=1; paintSettleLive(accruedCalls(),accruedCalls().reduce((a,k)=>a+k.c,0)); break;
    case "every": if(t.closest("button").getAttribute("aria-disabled")==="true")break; {const m=accruedCalls().length; S.ui.settleN=m; $("#nr").value=m; paintSettleLive(accruedCalls(),accruedCalls().reduce((a,k)=>a+k.c,0));} break;
    case "settleGo": {
      if(S.ui.settleBusy)break;
      S.ui.settleBusy=true; const items=accruedCalls(); const A=items.reduce((a,k)=>a+k.c,0); paintSettleLive(items,A);
      setTimeout(()=>{
        if(S.status!=="active"){S.ui.settleBusy=false;if(current==="settle")paintSettle();return}
        const n=S.ui.settleN, g=groupsFor(items,n), fee=g.reduce((a,grp)=>a+feeC(grp.reduce((x,k)=>x+k.c,0)),0);
        items.forEach(k=>{if(k.st==="accrued")k.st="captured"}); S.ui.settleBusy=false; S.ui.settleDone={n,amt:A,fee}; S.ui.settleN=null;
        S.log.push({t:clockStr(S.clock),m:`Captured ${fmt(A)} in ${n} step${n>1?"s":""}. Fees ${fmt(fee)}.`});
        say(`Captured ${fmt(A)} in ${n} steps.`); paintSettle(); $("#settleBody h1")?.setAttribute("tabindex","-1"); $("#settleBody h1")?.focus();
      },900); break;}
  }
  const j=t.closest("button[data-j]");
  if(j){S.ui.esc[j.dataset.j].v=+j.dataset.v; document.querySelectorAll(`button[data-j="${j.dataset.j}"]`).forEach(b=>{b.setAttribute("aria-checked",String(b===j));b.tabIndex=b===j?0:-1});paintEscrow()}
});

  if(t.matches("input[data-sc]")){const k=t.dataset.sc;S.ui.esc[k].s=+t.value;$("#scv"+k).textContent=t.value;paintEscrow()}
